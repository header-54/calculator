<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Header54 Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <!-- Header -->
        <div class="calc-header">
            <span class="logo">HEADER<span>54</span></span>

            <div class="status">
                <span class="dot"></span>
                Calculator
            </div>
        </div>

        <!-- Display -->
        <div class="display">
            <div id="previous"></div>
            <div id="current">0</div>
        </div>

        <!-- Buttons -->
        <div class="buttons">

            <button class="action" onclick="clearDisplay()">AC</button>
            <button class="action" onclick="deleteNumber()">⌫</button>
            <button class="operator" onclick="chooseOperation('%')">%</button>
            <button class="operator" onclick="chooseOperation('/')">÷</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="chooseOperation('*')">×</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="chooseOperation('-')">−</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="chooseOperation('+')">+</button>

            <button class="zero" onclick="appendNumber('0')">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>

        </div>

        <!-- Footer -->
        <div class="footer">
            <span>SECURE CALC</span>
            <span>HEADER54</span>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
